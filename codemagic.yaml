# Codemagic — cloud build for Afghan In USA (iOS)
#
# Builds an UNSIGNED release Runner.app on a cloud Mac — completely free
# (Codemagic personal tier: 500 macOS minutes/month) and needs no Apple
# Developer account. The zip can be signed later (Sideloadly/AltStore with a
# free Apple ID, or full distribution once the paid account exists).
#
# Flutter is pinned to the exact version the project was generated with, so
# the build machine does not auto-migrate the iOS project to Swift Package
# Manager (that migration broke the first build).
workflows:
  ios-release:
    name: Afghan In USA — iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.41.9
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.afghaninusa
    scripts:
      - name: Disable Swift Package Manager
        script: flutter config --no-enable-swift-package-manager || true
      - name: Pub get
        script: flutter pub get
      - name: CocoaPods install
        script: |
          cd ios
          pod install
      - name: Build iOS (unsigned release)
        script: |
          flutter build ios --release --no-codesign \
            --dart-define=SUPABASE_URL=https://uqwcahtlnaodaeusmzmm.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=sb_publishable_GF5HEOLIzABEsJxKeHaUmg_iUWd3YGl
      - name: Package unsigned app
        script: |
          cd build/ios/iphoneos
          zip -qry Runner-release-unsigned.zip Runner.app
    artifacts:
      - build/ios/iphoneos/Runner-release-unsigned.zip
    publishing:
      email:
        recipients:
          - YOUR_EMAIL@example.com
