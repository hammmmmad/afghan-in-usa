# Codemagic — cloud build for Afghan In USA (iOS)
#
# Builds an UNSIGNED release Runner.app on a cloud Mac — completely free
# (Codemagic personal tier: 500 macOS minutes/month) and needs no Apple
# Developer account. The zip can be signed later (Sideloadly/AltStore with a
# free Apple ID, or full distribution once the paid account exists).
#
# Flutter is pinned to the exact version the project was generated with.
# All iOS plugins (google_sign_in, firebase_*, ...) resolve as Swift Packages
# on this Flutter version, so the project is SPM-only: the Podfile was removed
# from the repo and CocoaPods must not be used (mixing SPM + CocoaPods is what
# broke the earlier builds with "sandbox is not in sync with the Podfile.lock").
workflows:
  ios-release:
    name: Afghan In USA — iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.41.9
      xcode: latest
      vars:
        BUNDLE_ID: com.afghaninusa
    scripts:
      - name: Pub get
        script: flutter pub get
      - name: Verify SPM-only project (no CocoaPods)
        script: |
          cd ios
          if [ -f Podfile ] || [ -d Pods ]; then
            echo "CocoaPods artifacts found; removing (project is SPM-only)."
            rm -f Podfile Podfile.lock
            rm -rf Pods
          fi
      - name: Build iOS (unsigned release)
        script: |
          # flutter build (not raw xcodebuild) is required: the Flutter tool
          # generates GeneratedPluginRegistrant and syncs every plugin's Swift
          # Package into the Xcode project. Raw xcodebuild skips that sync and
          # fails with "Module 'app_links' not found". --no-codesign disables
          # signing, so no Apple Developer account is needed.
          flutter build ios --release --no-codesign \
            --dart-define=SUPABASE_URL=https://uqwcahtlnaodaeusmzmm.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=sb_publishable_GF5HEOLIzABEsJxKeHaUmg_iUWd3YGl
      - name: Package unsigned app
        script: |
          cd build/ios/iphoneos
          zip -qry Runner-release-unsigned.zip Runner.app
    artifacts:
      - build/ios/iphoneos/Runner-release-unsigned.zip
    publishing:
      email:
        recipients:
          - Merlinsarfraz123@gmail.com
